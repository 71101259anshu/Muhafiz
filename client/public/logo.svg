<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dark blue background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e3a5f"/>
  
  <!-- Graduation cap -->
  <g transform="translate(100, 85)">
    <!-- Cap top (board) -->
    <path d="M -35 -15 L 0 -25 L 35 -15 L 35 -10 L 0 -20 L -35 -10 Z" 
          fill="#4fc3f7" stroke="#29b6f6" stroke-width="1.5"/>
    
    <!-- Cap base -->
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#4fc3f7"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#29b6f6" opacity="0.3"/>
    
    <!-- Tassel -->
    <line x1="35" y1="-12" x2="35" y2="5" stroke="#ffd54f" stroke-width="2"/>
    <circle cx="35" cy="8" r="4" fill="#ffd54f"/>
  </g>
  
  <!-- Checkmark circle -->
  <g transform="translate(140, 130)">
    <circle cx="0" cy="0" r="18" fill="white"/>
    <path d="M -6 0 L -2 5 L 6 -5" 
          stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" 
          stroke-linejoin="round" fill="none"/>
  </g>
</svg>